vo=gpu-next
gpu-context=drm

hwdec=vaapi

drm-format=xrgb2101010

video-output-levels=full
profile=profile-sdr
audio-stream-silence=yes

sub-visibility=no

tone-mapping=spline
hdr-compute-peak=yes

# Buffering. These previously sat below the [profile-hdr] header, which made them
# part of that profile rather than global options - and profile-hdr is never
# applied (its profile-cond is commented out), so none of them ever took effect.
audio-buffer=1
cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=200M
demuxer-readahead-secs=120
stream-buffer-size=2M

# Also stranded in profile-hdr. Deliberately left off for now: turning it on at
# the same time as the buffering fix would change two variables at once.
#video-sync=display-resample

# --- temporary blip diagnostics (remove when done) ---
log-file=/tmp/mpv.log
msg-level=ao=v,ad=v,audio=v,cplayer=v,cache=v,demux=v,stream=v,ffmpeg=v

[profile-sdr]
#profile-cond=video_params["primaries"] == "bt.709"
target-trc=bt.1886
target-peak=203
target-prim=bt.709
#target-colorspace-hint=yes
target-gamut=bt.709

[profile-hdr]
#profile-cond=video_params["gamma"] == "pq"
target-trc=pq
target-prim=bt.2020
target-peak=1000
target-gamut=bt.2020
#target-colorspace-hint=yes
