vo=gpu-next
gpu-context=drm

hwdec=vaapi

drm-format=xrgb2101010

video-output-levels=full
profile=profile-sdr
audio-stream-silence=yes

sub-visibility=no

tone-mapping=spline
hdr-compute-peak=yes

# Buffering. These previously sat below the [profile-hdr] header, which scoped
# them to that profile instead of leaving them global. profile-hdr is the
# dormant HDR-passthrough branch (SDR tone-mapping is the intended path), so
# nothing here ever took effect - readahead ran at mpv's 1s default, not 120s.
audio-buffer=1
cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=200M
demuxer-readahead-secs=120
stream-buffer-size=2M

# Also stranded in profile-hdr. Left off deliberately - never verified as
# wanted, and it can introduce audio artifacts of its own.
#video-sync=display-resample


[profile-sdr]
#profile-cond=video_params["primaries"] == "bt.709"
target-trc=bt.1886
target-peak=203
target-prim=bt.709
#target-colorspace-hint=yes
target-gamut=bt.709

[profile-hdr]
#profile-cond=video_params["gamma"] == "pq"
target-trc=pq
target-prim=bt.2020
target-peak=1000
target-gamut=bt.2020
#target-colorspace-hint=yes
